name: Release

# Tart needs Apple Silicon, so `dirtbag` is built only for aarch64-apple-darwin.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Read crate version
        id: crate
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tagged build must ship the version it claims.
      - name: Check tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="${{ steps.crate.outputs.version }}"
          if [ "$tag" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      # The end-to-end tests are `#[ignore]`d; they need a real VM.
      - name: Test
        run: cargo test --locked --target "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name="dirtbag-${{ steps.crate.outputs.version }}-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/dirtbag" README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirtbag-${{ steps.crate.outputs.version }}-${{ env.TARGET }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag such as v0.2.0-rc1 is a pre-release.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac

          sed "s/{{VERSION}}/${{ steps.crate.outputs.version }}/g" \
            .github/release-notes.md > notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/*.sha256
