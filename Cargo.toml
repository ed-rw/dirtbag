[package]
name = "dirtbag"
version = "0.0.0"
edition = "2021"
description = "Vagrant-style CLI for managing Tart VMs as disposable dev sandboxes"
license = "MIT"

[[bin]]
name = "dirtbag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
nix = { version = "0.29", features = ["process", "signal", "fs", "term"] }
ssh2 = "0.9"
crossterm = "0.28"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
